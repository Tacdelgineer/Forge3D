# The socket directory must outlive a restart of forge3d-resctl: it is bind
# mounted into the Forge3D container, and a directory recreated underneath a
# live bind mount leaves the container holding a stale inode. Creating it here
# rather than with RuntimeDirectory= keeps the inode stable; the daemon only
# ever replaces the socket file inside it.
d /run/forge3d-resctl 0750 root 1000 -
