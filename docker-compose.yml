services:
  trellis:
    build:
      context: .
      args:
        MAX_JOBS: ${MAX_JOBS:-8}
    image: 3d-generator-trellis:latest
    container_name: 3d-generator-trellis

    # Deliberately NOT "always": this service must only run when started by hand,
    # so a reboot never silently reclaims tens of GB of unified memory.
    restart: "no"

    # runtime: nvidia (rather than deploy.resources) because it reliably honours
    # NVIDIA_DRIVER_CAPABILITIES, which we need for "graphics" -> EGL.
    runtime: nvidia

    user: "${UID:-1000}:${GID:-1000}"

    # Bind address for the dashboard. Defaults to loopback only.
    # Set FORGE3D_BIND in .env to your Tailscale IP to reach it from another
    # device (matches how ollama and spark-status already bind on this host).
    # Avoid 0.0.0.0: docker publishes ports through its own iptables chain and
    # bypasses ufw, so that would expose the UI to the whole LAN with no auth.
    ports:
      - "${FORGE3D_BIND:-127.0.0.1}:8189:8189"

    volumes:
      - ./data:/app/data
      - ./models:/app/models
      # Exclusive / Max Quality: the ONLY host access this container gets.
      # A directory holding one Unix socket, owned root:1000 mode 0660, served
      # by host/forge3d-resctl, which exposes four verbs and no shell. There is
      # deliberately no docker.sock and no systemd here - see
      # docs/step-06-exclusive-max-quality.md. If the helper is not installed
      # the directory is simply empty and Exclusive mode reports itself
      # unavailable; everything else is unaffected.
      - ${FORGE3D_RESCTL_DIR:-/run/forge3d-resctl}:/run/forge3d-resctl

    environment:
      NVIDIA_VISIBLE_DEVICES: all
      # "graphics" is the addition over the usual compute,utility — without it
      # libEGL_nvidia.so.0 is never injected and EGL falls back to llvmpipe.
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics

      HF_TOKEN: ${HF_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}

      TRELLIS_MIN_AVAILABLE_GB: ${TRELLIS_MIN_AVAILABLE_GB:-65}
      TRELLIS_PROTECTED_FLOOR_GB: ${TRELLIS_PROTECTED_FLOOR_GB:-40}
      TRELLIS_MODEL_REPO: ${TRELLIS_MODEL_REPO:-microsoft/TRELLIS.2-4B}
      TRELLIS_PIPELINE_TYPE: ${TRELLIS_PIPELINE_TYPE:-512}
      ATTN_BACKEND: ${ATTN_BACKEND:-flash_attn}

      FORGE3D_RESCTL_SOCKET: ${FORGE3D_RESCTL_SOCKET:-/run/forge3d-resctl/resctl.sock}
      FORGE3D_EXCLUSIVE_LEASE_S: ${FORGE3D_EXCLUSIVE_LEASE_S:-1800}

      # Where the optional Hunyuan worker lives. If that container is not
      # running, the Hunyuan generators simply show as unavailable.
      HUNYUAN_URL: ${HUNYUAN_URL:-http://hunyuan:8190}

    shm_size: "8gb"
    stop_grace_period: 30s

  # Optional second backend, started only on request:
  #     docker compose --profile hunyuan up -d
  # Kept out of the default profile so `docker compose up -d` behaves exactly
  # as it did before Step 5 and TRELLIS's memory profile is untouched.
  hunyuan:
    profiles: ["hunyuan"]
    build:
      context: ./hunyuan
      args:
        MAX_JOBS: ${MAX_JOBS:-4}
    image: 3d-generator-hunyuan:latest
    container_name: 3d-generator-hunyuan
    restart: "no"
    runtime: nvidia
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      # Loopback only; Forge3D reaches it over the compose network by name.
      - "127.0.0.1:8190:8190"
    volumes:
      - ./models/hunyuan:/models
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /models/hf
    shm_size: "8gb"
    stop_grace_period: 30s
